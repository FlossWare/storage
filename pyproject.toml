[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storage"
version = "0.1.0"
description = "Storage contracts and in-memory reference implementation for FlossWare"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
